<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>바코드 생성</title>
    <script src="https://cdn.jsdelivr.net/npm/bwip-js@4.7.0/dist/bwip-js.min.js"></script>
    <style>
      :root {
        color-scheme: light;
        --bg: #eaf7ff;
        --bg-strong: #c7ebff;
        --panel: #ffffff;
        --panel-soft: #f6fcff;
        --text: #123247;
        --muted: #526b7d;
        --line: #a7d8f5;
        --accent: #159bd6;
        --accent-dark: #087db2;
        --accent-soft: #dff5ff;
        --danger: #b42318;
        --shadow: 0 20px 60px rgb(31 127 177 / 16%);
      }

      * {
        box-sizing: border-box;
      }

      html {
        min-width: 320px;
      }

      body {
        margin: 0;
        min-height: 100vh;
        color: var(--text);
        background:
          linear-gradient(180deg, var(--bg-strong) 0, var(--bg) 280px, #f7fcff 100%);
        font-family:
          ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Apple SD Gothic Neo", "Noto Sans KR", "Segoe UI", sans-serif;
      }

      main {
        width: min(980px, calc(100% - 28px));
        margin: 0 auto;
        padding: 28px 0 42px;
      }

      .header {
        display: grid;
        gap: 8px;
        margin-bottom: 20px;
      }

      h1 {
        margin: 0;
        font-size: clamp(30px, 7vw, 52px);
        line-height: 1.08;
        letter-spacing: 0;
      }

      .subtitle {
        max-width: 680px;
        margin: 0;
        color: var(--muted);
        font-size: clamp(14px, 2.5vw, 17px);
        line-height: 1.55;
      }

      .app {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 16px;
      }

      .panel {
        display: grid;
        gap: 16px;
        padding: 18px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        box-shadow: var(--shadow);
      }

      .fields {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
      }

      .full {
        grid-column: 1 / -1;
      }

      label {
        display: grid;
        gap: 7px;
        min-width: 0;
        color: var(--text);
        font-size: 14px;
        font-weight: 800;
      }

      textarea,
      select,
      input {
        width: 100%;
        min-width: 0;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 12px 13px;
        color: var(--text);
        background: #fff;
        font: inherit;
      }

      textarea {
        min-height: 112px;
        resize: vertical;
        line-height: 1.45;
      }

      textarea:focus,
      select:focus,
      input:focus {
        outline: 3px solid rgb(21 155 214 / 20%);
        border-color: var(--accent);
      }

      .guide {
        display: grid;
        gap: 8px;
        margin: 0;
        border: 1px solid #bde6fa;
        border-radius: 8px;
        padding: 12px 14px;
        color: var(--muted);
        background: var(--accent-soft);
        font-size: 13px;
        line-height: 1.5;
      }

      .guide strong {
        color: var(--text);
      }

      .preview {
        display: grid;
        gap: 12px;
      }

      .canvasWrap {
        display: grid;
        place-items: center;
        min-height: 260px;
        overflow: auto;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 16px;
        background:
          linear-gradient(45deg, #f7fcff 25%, transparent 25%),
          linear-gradient(-45deg, #f7fcff 25%, transparent 25%),
          linear-gradient(45deg, transparent 75%, #f7fcff 75%),
          linear-gradient(-45deg, transparent 75%, #f7fcff 75%),
          #ffffff;
        background-position: 0 0, 0 8px, 8px -8px, -8px 0;
        background-size: 16px 16px;
      }

      canvas {
        display: block;
        margin: 0 auto;
        max-width: 100%;
        height: auto;
        image-rendering: auto;
      }

      .resultText {
        margin: 0;
        overflow-wrap: anywhere;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.45;
      }

      .error {
        display: none;
        margin: 0;
        color: var(--danger);
        font-weight: 800;
        line-height: 1.45;
      }

      .error.visible {
        display: block;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      button,
      a.button {
        min-height: 44px;
        border: 0;
        border-radius: 8px;
        padding: 11px 16px;
        color: #fff;
        background: var(--accent);
        font: inherit;
        font-weight: 900;
        text-align: center;
        text-decoration: none;
        cursor: pointer;
      }

      button:hover,
      a.button:hover {
        background: var(--accent-dark);
      }

      .secondary {
        color: var(--accent-dark);
        background: #dff5ff;
      }

      .secondary:hover {
        background: #c9ecfb;
      }

      @media (min-width: 880px) {
        main {
          padding-top: 46px;
        }

        .app {
          grid-template-columns: minmax(0, 0.92fr) minmax(0, 1.08fr);
          align-items: start;
        }

        .preview {
          position: sticky;
          top: 20px;
        }

        .canvasWrap {
          min-height: 420px;
        }
      }

      @media (max-width: 640px) {
        main {
          width: min(100% - 20px, 980px);
          padding-top: 22px;
        }

        .fields {
          grid-template-columns: 1fr;
        }

        .panel {
          padding: 14px;
        }

        .actions > * {
          flex: 1 1 150px;
        }

        .canvasWrap {
          justify-content: center;
          align-content: center;
          min-height: 230px;
          padding: 12px;
        }

        canvas {
          justify-self: center;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header class="header">
        <h1>바코드 생성</h1>
        <p class="subtitle">
          바코드 생성 페이지 입니다
        </p>
      </header>

      <section class="app" aria-label="바코드 생성 도구">
        <form class="panel" id="barcodeForm">
          <div class="fields">
            <label>
              생성 형식
              <select id="codeType">
                <option value="code128">CODE128 일반 바코드</option>
                <option value="ean13">EAN-13 일반 바코드</option>
                <option value="itf14">ITF-14 일반 바코드</option>
                <option value="code39">CODE39 일반 바코드</option>
                <option value="qrcode">QR 코드</option>
                <option value="gs1expanded">GS1 Expanded 2~3줄 바코드</option>
              </select>
            </label>

            <label>
              출력 크기
              <select id="scale">
                <option value="2">작게</option>
                <option value="3" selected>보통</option>
                <option value="4">크게</option>
              </select>
            </label>

            <label class="full">
              입력값
              <textarea id="barcodeValue" spellcheck="false" autocomplete="off">8801234567893</textarea>
            </label>
          </div>

          <p class="guide" id="guideText">
            <strong>입력 방식</strong>
            만들고 싶은 값을 입력한 뒤 생성 형식을 선택하세요. EAN-13은 숫자 12자리 또는 13자리를 입력하면 됩니다.
          </p>

          <p class="error" id="errorMessage" role="alert"></p>

          <div class="actions">
            <button type="submit">생성하기</button>
            <button class="secondary" id="sampleButton" type="button">예시 입력</button>
            <a class="button" id="downloadLink" href="#" download="barcode.png">PNG 다운로드</a>
          </div>
        </form>

        <section class="panel preview" aria-label="생성 결과">
          <div class="canvasWrap">
            <canvas id="barcodeCanvas" aria-label="생성된 바코드"></canvas>
          </div>
          <p class="resultText" id="resultText"></p>
        </section>
      </section>
    </main>

    <script>
      const form = document.querySelector("#barcodeForm");
      const codeType = document.querySelector("#codeType");
      const scale = document.querySelector("#scale");
      const barcodeValue = document.querySelector("#barcodeValue");
      const guideText = document.querySelector("#guideText");
      const errorMessage = document.querySelector("#errorMessage");
      const resultText = document.querySelector("#resultText");
      const sampleButton = document.querySelector("#sampleButton");
      const downloadLink = document.querySelector("#downloadLink");
      const canvas = document.querySelector("#barcodeCanvas");

      const samples = {
        code128: "8801234567893",
        ean13: "8801234567893",
        itf14: "18801234567890",
        code39: "BARCODE123",
        qrcode: "https://example.com",
        gs1expanded: "010286729000000870032605112359\u001d310300093239200016680\u001d993",
      };

      const guides = {
        code128:
          "<strong>CODE128</strong>은 영문, 숫자, 일부 기호를 폭넓게 지원하는 일반 1차원 바코드입니다.",
        ean13:
          "<strong>EAN-13</strong>은 숫자 12자리 또는 13자리를 입력하세요. 체크 digit은 라이브러리가 처리합니다.",
        itf14:
          "<strong>ITF-14</strong>는 주로 물류 박스 단위에 쓰는 14자리 숫자 바코드입니다.",
        code39:
          "<strong>CODE39</strong>는 영문 대문자, 숫자, 일부 기호를 지원하는 일반 바코드입니다.",
        qrcode:
          "<strong>QR 코드</strong>는 URL, 텍스트, 숫자 등 원하는 값을 입력할 수 있습니다.",
        gs1expanded:
          "<strong>GS1 Expanded 2~3줄 바코드</strong>는 입력한 데이터를 GS1 DataBar Expanded Stacked 형태로 생성합니다. 중간 구분자는 실제 FNC1/GS 문자 또는 <strong>(fnc)</strong>로 입력하세요.",
      };

      const typeOptions = {
        code128: {
          bcid: "code128",
          height: 18,
          includetext: true,
          textxalign: "center",
          filename: "code128.png",
        },
        ean13: {
          bcid: "ean13",
          height: 18,
          includetext: true,
          textxalign: "center",
          filename: "ean13.png",
        },
        itf14: {
          bcid: "itf14",
          height: 18,
          includetext: true,
          textxalign: "center",
          filename: "itf14.png",
        },
        code39: {
          bcid: "code39",
          height: 18,
          includetext: true,
          textxalign: "center",
          filename: "code39.png",
        },
        qrcode: {
          bcid: "qrcode",
          eclevel: "M",
          filename: "qr-code.png",
        },
        gs1expanded: {
          bcid: "databarexpandedstacked",
          height: 12,
          segments: 4,
          includetext: true,
          textxalign: "center",
          parsefnc: true,
          dontlint: true,
          filename: "gs1-expanded.png",
        },
      };

      const fixedLengthAis = {
        "00": 18,
        "01": 14,
        "02": 14,
        "11": 6,
        "12": 6,
        "13": 6,
        "15": 6,
        "16": 6,
        "17": 6,
        "20": 2,
      };

      function setError(message) {
        errorMessage.textContent = message;
        errorMessage.classList.toggle("visible", Boolean(message));
      }

      function findAi(segment, index) {
        const fourDigitAi = segment.slice(index, index + 4);
        const twoDigitAi = segment.slice(index, index + 2);

        if (/^3[1-6]\d\d$/.test(fourDigitAi)) {
          return { ai: fourDigitAi, dataLength: 6 };
        }

        if (fourDigitAi === "7003") {
          return { ai: fourDigitAi, dataLength: 10 };
        }

        if (fixedLengthAis[twoDigitAi]) {
          return { ai: twoDigitAi, dataLength: fixedLengthAis[twoDigitAi] };
        }

        return { ai: twoDigitAi, dataLength: segment.length - index - 2 };
      }

      function addGs1AiParentheses(segment) {
        if (segment.startsWith("(")) {
          return segment;
        }

        let index = 0;
        let formatted = "";

        while (index < segment.length) {
          const { ai, dataLength } = findAi(segment, index);
          const dataStart = index + ai.length;
          const dataEnd = Math.min(dataStart + dataLength, segment.length);
          const data = segment.slice(dataStart, dataEnd);

          if (!data) {
            return `${formatted}(${ai})`;
          }

          formatted += `(${ai})${data}`;
          index = dataEnd;
        }

        return formatted;
      }

      function normalizeGs1ExpandedText(rawText) {
        return rawText
          .replace(/\(fnc1?\)/gi, "\u001d")
          .split(/\u001d|\x1d/)
          .map(addGs1AiParentheses)
          .join("^029");
      }

      function getRenderOptions() {
        const type = codeType.value;
        const config = typeOptions[type];
        const rawText = barcodeValue.value.trim();

        if (!rawText) {
          throw new Error("입력값을 작성하세요.");
        }

        const text = type === "gs1expanded"
          ? normalizeGs1ExpandedText(rawText)
          : rawText;

        return {
          ...config,
          text,
          scale: Number(scale.value),
          backgroundcolor: "FFFFFF",
          paddingwidth: 10,
          paddingheight: 10,
        };
      }

      function getDisplayText() {
        return barcodeValue.value
          .trim()
          .replace(/\u001d|\x1d/g, "(FNC)");
      }

      function updateDownload(filename) {
        canvas.toBlob((blob) => {
          if (!blob) {
            setError("다운로드 이미지를 만들 수 없습니다.");
            return;
          }

          if (downloadLink.dataset.url) {
            URL.revokeObjectURL(downloadLink.dataset.url);
          }

          const url = URL.createObjectURL(blob);
          downloadLink.href = url;
          downloadLink.download = filename;
          downloadLink.dataset.url = url;
        }, "image/png");
      }

      function render() {
        try {
          const options = getRenderOptions();
          bwipjs.toCanvas(canvas, options);

          setError("");
          resultText.textContent = `생성된 값: ${getDisplayText()}`;
          updateDownload(typeOptions[codeType.value].filename);
        } catch (error) {
          const context = canvas.getContext("2d");
          context.clearRect(0, 0, canvas.width, canvas.height);
          resultText.textContent = "";
          setError(error.message || "바코드를 생성할 수 없습니다. 입력 형식을 확인하세요.");
        }
      }

      function updateMode() {
        const type = codeType.value;
        guideText.innerHTML = guides[type];

        if (barcodeValue.value.trim() === "" || Object.values(samples).includes(barcodeValue.value.trim())) {
          barcodeValue.value = samples[type];
        }

        render();
      }

      form.addEventListener("submit", (event) => {
        event.preventDefault();
        render();
      });

      codeType.addEventListener("change", updateMode);
      scale.addEventListener("change", render);
      barcodeValue.addEventListener("input", render);
      sampleButton.addEventListener("click", () => {
        barcodeValue.value = samples[codeType.value];
        render();
      });
      window.addEventListener("beforeunload", () => {
        if (downloadLink.dataset.url) {
          URL.revokeObjectURL(downloadLink.dataset.url);
        }
      });

      updateMode();
    </script>
  </body>
</html>
